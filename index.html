<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maymerines Rider</title>
<style>
body{margin:0;font-family:Arial;background:#f7f7f7;color:#222}.wrap{max-width:560px;margin:auto}
header{background:#0b8f4d;color:#fff;text-align:center;padding:18px;border-radius:0 0 24px 24px}
.logo{width:150px;height:150px;object-fit:contain;border-radius:50%;background:#fff}.brand{font-size:24px;font-weight:800;margin-top:8px}
.tag{margin-top:6px}.box{background:#fff;margin:18px 16px;padding:18px;border-radius:16px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px}.cat{padding:18px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 10px #0001;font-size:16px}
label{font-weight:bold;display:block;margin:10px 0 5px}input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}
button.order{width:100%;padding:15px;border:0;border-radius:10px;background:#0b8f4d;color:#fff;font-weight:bold;font-size:16px;margin-top:14px}
footer{text-align:center;padding:20px;color:#666;font-size:13px}
</style></head><body><div class="wrap">
<header><img class="logo" src="logo.png"><div class="brand">MAYMERINES RIDER</div><div class="tag">Food & Non-Food Delivery • Maymar & Nearby Areas</div></header>
<div class="box">📍 <b>Maymar & Nearby Areas</b><br><small>Pickup from your location and delivery to your doorstep.</small></div>
<h2 style="margin-left:16px">What do you need?</h2>
<div class="grid"><button class="cat" onclick="setCat('Food')">🍔 Food</button><button class="cat" onclick="setCat('Grocery')">🛒 Grocery</button><button class="cat" onclick="setCat('Medicine')">💊 Medicine</button><button class="cat" onclick="setCat('Other')">📦 Other Items</button></div>
<h2 style="margin-left:16px">Place Your Order</h2><div class="box"><form onsubmit="sendOrder(event)">
<label>Name</label><input id="name" required><label>Phone Number</label><input id="phone" required type="tel">
<label>Category</label><select id="category"><option>Food</option><option>Grocery</option><option>Medicine</option><option>Other</option></select>
<label>Pickup Location</label><input id="pickup" required><label>Delivery Address</label><input id="address" required>
<label>Order Details</label><textarea id="details" required rows="4"></textarea><p><b>Delivery Charge: Rs. 200</b></p>
<button class="order">📲 PLACE ORDER ON WHATSAPP</button></form></div>
<footer>Maymerines Rider • 24/7 Delivery<br>WhatsApp: 0340-8313345</footer></div>
<script>
function setCat(v){category.value=v;document.querySelector('form').scrollIntoView({behavior:'smooth'})}
function sendOrder(e){e.preventDefault();let m=`🚚 MAYMERINES RIDER ORDER\n\nName: ${name.value}\nPhone: ${phone.value}\nCategory: ${category.value}\nPickup: ${pickup.value}\nDelivery Address: ${address.value}\nOrder: ${details.value}\nDelivery Charge: Rs. 200`;location.href='https://wa.me/923408313345?text='+encodeURIComponent(m)}
</script></body></html>
